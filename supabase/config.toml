# Supabase CLI configuration (plan §11.2).
# Local development: `supabase start`, then `supabase db reset` applies
# migrations + seed.sql.

project_id = "tarang-fest"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "https://tarangfest.in/auth/callback",
  "https://register.tarangfest.in/auth/callback",
  "https://admin.tarangfest.in/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

# GoTrue's own limits are per client IP, and the browser talks to Supabase
# Auth directly. A whole college on campus Wi-Fi (or a carrier's CGNAT) is
# one IP, so the stock values (~30 sign-ins / 5 min, ~150 token refreshes /
# 5 min) lock students out at launch. The hosted project does not read this
# file: set the same numbers in Dashboard → Authentication → Rate Limits (or
# run `supabase config push`). Values are per 5 minutes per IP, except
# email_sent, which is per hour and only applies with custom SMTP.
[auth.rate_limit]
email_sent = 1000
sms_sent = 30
anonymous_users = 30
token_refresh = 5000
sign_in_sign_ups = 1500
token_verifications = 1500

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.external.google]
enabled = false
# client_id = "..."
# secret = "..."
# redirect_uri = "http://localhost:54321/auth/v1/callback"

[analytics]
enabled = false
