# TARANG 2026 — production compose (plan §15.2, §15.3).
#
# One immutable image, blue/green web services + background worker:
#   web-blue  — Next.js standalone slot A (127.0.0.1:3001) behind Nginx
#   web-green — Next.js standalone slot B (127.0.0.1:3002) behind Nginx
#   worker    — background loop (hold reaper, outbox, email, reconcile, exports)
#   migrate   — one-shot migration runner (profile `tools`; deploy.sh runs it
#               with `docker compose run --rm migrate` before the cutover)
#
# Note on multi-origin scaling:
# Duplicate workers are safe (DB leases). For multi-origin deployments,
# `exports-data` must be backed by shared storage (NFS/EFS or Supabase Storage)
# so that CSV downloads created on one origin can be downloaded from another.
# Secrets come from the environment / .env file — never bake them into the image.

# Container hardening shared by every service: tini as PID 1 (signal
# forwarding + zombie reaping, so SIGTERM drains in-flight requests), no Linux
# capabilities (Node binds :3000, nothing needs root powers), no setuid
# escalation. (The pid cap against fork bombs lives in each service's
# deploy.resources.limits — compose rejects pids_limit next to it.)
x-hardening: &hardening
  init: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

x-web-service: &web-service
  <<: *hardening
  image: ${TARANG_IMAGE:?set TARANG_IMAGE to the promoted image digest}
  restart: unless-stopped
  command: ["node", "server.js"]
  env_file:
    - .env
  environment:
    NODE_ENV: production
    PORT: 3000
    HOSTNAME: 0.0.0.0
    DEPLOYMENT_ID: ${DEPLOYMENT_ID:-}
  deploy:
    resources:
      limits:
        memory: 2g
        pids: 512
  stop_grace_period: 30s
  read_only: true
  tmpfs:
    - /tmp
  volumes:
    - exports-data:/app/.exports
    - uploads-data:/app/public/uploads
    # Next writes ISR/prerender/image cache entries at runtime. Keep the
    # container root read-only and provide only this dedicated writable path.
    - next-cache:/app/.next/cache
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health/live"]
    interval: 15s
    timeout: 3s
    retries: 3
    start_period: 15s
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  web-blue:
    <<: *web-service
    ports:
      - "127.0.0.1:3001:3000"

  web-green:
    <<: *web-service
    ports:
      - "127.0.0.1:3002:3000"

  worker:
    <<: *hardening
    image: ${TARANG_IMAGE:?set TARANG_IMAGE to the promoted image digest}
    restart: unless-stopped
    command: ["node", "dist/worker.cjs"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      EXPORT_DIR: /app/.exports
    deploy:
      resources:
        limits:
          memory: 1g
          pids: 256
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - exports-data:/app/.exports
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # One-shot: applies supabase/migrations/*.sql not yet recorded in
  # supabase_migrations.schema_migrations. Needs SUPABASE_DB_SESSION_URL
  # (session pooler, port 5432) in .env. Never started by `up`.
  migrate:
    <<: *hardening
    image: ${TARANG_IMAGE:?set TARANG_IMAGE to the promoted image digest}
    profiles: ["tools"]
    restart: "no"
    command: ["node", "dist/migrate.cjs", "--migrations"]
    deploy:
      resources:
        limits:
          memory: 512m
          pids: 128
    env_file:
      - .env
    environment:
      NODE_ENV: production
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  exports-data:
  uploads-data:
  next-cache:
