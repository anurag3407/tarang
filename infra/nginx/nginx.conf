# TARANG 2026 — main nginx.conf (plan §15.4).
#
# TLS-only origin behind Cloudflare (Full strict + Authenticated Origin Pulls).
# Validate with `nginx -t` before every reload (deploy.sh does this).

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Structured access log: request id, CF-Ray, canonical IP, host, route,
    # status, upstream, timings (plan §15.4).
    log_format tarang_json escape=json
        '{'
            '"time":"$time_iso8601",'
            '"request_id":"$request_id",'
            '"cf_ray":"$http_cf_ray",'
            '"ip":"$remote_addr",'
            '"host":"$host",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"bytes":$body_bytes_sent,'
            '"upstream":"$upstream_addr",'
            '"upstream_status":"$upstream_status",'
            '"connect_time":"$upstream_connect_time",'
            '"header_time":"$upstream_header_time",'
            '"response_time":"$upstream_response_time",'
            '"request_time":"$request_time",'
            '"ua":"$http_user_agent"'
        '}';
    access_log /var/log/nginx/access.log tarang_json;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;

    # Bounded timeouts (plan §15.4).
    keepalive_timeout 65s;
    keepalive_requests 1000;
    client_body_timeout 20s;
    client_header_timeout 15s;
    send_timeout 30s;

    # Request buffering stays ON to protect Node from slow uploads.
    proxy_request_buffering on;

    # Trust only Cloudflare ranges for the real client IP (see
    # snippets/cloudflare-real-ip.conf, kept current by
    # update-cloudflare-cidrs.sh). Snippets live outside conf.d/ so the
    # conf.d/*.conf glob below never includes them a second time at http level.
    include /etc/nginx/snippets/cloudflare-real-ip.conf;
    real_ip_header CF-Connecting-IP;

    # TLS defaults shared by every server block. Cloudflare is the only client
    # (Authenticated Origin Pulls), so modern-only protocols are safe.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # Default body cap; server/location blocks raise it where needed.
    client_max_body_size 256k;
    large_client_header_buffers 4 16k;

    # Gzip fallback; Cloudflare Brotli handles edge delivery (plan §15.4).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml application/rss+xml image/svg+xml;

    # No broad proxy cache for HTML/RSC/API (plan §15.4) — Cloudflare is the
    # only cache layer, driven by explicit Cache-Control headers.

    include /etc/nginx/conf.d/*.conf;
}
