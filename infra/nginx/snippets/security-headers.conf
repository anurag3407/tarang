# Security headers for every app-serving server block (V-07).
# Included from within `server { }` blocks via
#   include /etc/nginx/snippets/security-headers.conf;
#
# Lives in snippets/, not conf.d/: nginx.conf globs conf.d/*.conf at http
# level, which would apply these headers twice.
#
# Note: nginx drops inherited add_header directives in any location that
# declares its own add_header, so locations must not add headers ad hoc.
#
# Camera is allowed for the scanner PWA (camera=(self)); everything else is
# denied by default. frame-ancestors 'none' prevents clickjacking; being the
# only directive in the CSP it does not restrict scripts/styles.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), payment=(), camera=(self)" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
# HSTS without includeSubDomains/preload: subdomains outside this app must
# stay free to choose their own TLS posture. Cloudflare serves every proxied
# hostname over HTTPS, so one year is safe for the apex.
add_header Strict-Transport-Security "max-age=31536000" always;
