# --- hooks: webhooks + jobs (no browser challenges at edge) -------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hooks.${PULSE_DOMAIN};

    ssl_certificate     /etc/nginx/tls/origin.pem;
    ssl_certificate_key /etc/nginx/tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_client_certificate /etc/nginx/tls/cloudflare-aop-ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 2;

    # Webhook bodies are bounded (plan §12.8: raw body kept small).
    include /etc/nginx/conf.d/security-headers.conf;

    client_max_body_size 1m;


    # Only POST is meaningful for webhooks/jobs.
    if ($request_method !~ ^(POST|GET)$) {
        return 405;
    }

    location / {
        proxy_pass http://next_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 5s;
        # Webhook handlers must return 2xx quickly (durable insert + after()).
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }
}
