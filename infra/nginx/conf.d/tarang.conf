# PULSE 2026 — site config (plan §3.2, §15.4, §15.5).
#
# Hostnames (replace ${PULSE_DOMAIN} at deploy time via envsubst):
#   www.${PULSE_DOMAIN}      public website
#   register.${PULSE_DOMAIN} login/dashboard/checkout (Waiting Room at edge)
#   admin.${PULSE_DOMAIN}    staff admin panel
#   scan.${PULSE_DOMAIN}     scanner PWA
#   hooks.${PULSE_DOMAIN}    Razorpay/Resend/QStash webhooks + jobs
#
# TLS is terminated here with Cloudflare Authenticated Origin Pulls:
# clients must present the zone AOP certificate signed by the Cloudflare CA.
# Unknown Host/SNI is rejected by the default server (444 = drop connection).

# --- Default server: reject everything that is not one of our hosts -------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;

    ssl_certificate     /etc/nginx/tls/origin.pem;
    ssl_certificate_key /etc/nginx/tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Authenticated Origin Pulls (plan §15.5.2).
    ssl_client_certificate /etc/nginx/tls/cloudflare-aop-ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 2;

    server_name _;
    return 444;
}


# --- Shared proxy settings ---------------------------------------------------
# Included by each server block. proxy_buffering off keeps Next streaming
# (RSC, Suspense) flowing; request buffering stays on (http level).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- www: public website -----------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.${PULSE_DOMAIN};

    ssl_certificate     /etc/nginx/tls/origin.pem;
    ssl_certificate_key /etc/nginx/tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_client_certificate /etc/nginx/tls/cloudflare-aop-ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 2;

    include /etc/nginx/conf.d/security-headers.conf;

    client_max_body_size 256k;

    location /_next/static/ {
        proxy_pass http://next_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://next_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}

