# TARANG — single-root-domain site config (Cloudflare Full strict + AOP).
#
# Use this INSTEAD OF tarang.conf when the whole app runs on one hostname.
# Install exactly one of the two: both files declare `upstream next_app`,
# the `$connection_upgrade` map, and a `default_server`, so having both in
# /etc/nginx/conf.d/ makes `nginx -t` fail with duplicate definitions.
#
# ${TARANG_DOMAIN} is substituted at install time via envsubst. On the
# Lightsail origin infra/scripts/bootstrap-lightsail.sh does this; by hand:
#   export TARANG_DOMAIN=tarangfest.in
#   envsubst '${TARANG_DOMAIN}' \
#     < infra/nginx/conf.d/tarang-single-domain.conf \
#     > /etc/nginx/conf.d/tarang.conf
#
# The app does no host-based routing (src/proxy.ts guards paths only, and the
# *_SITE_URL vars merely feed the CSRF allowlist in src/lib/csrf.ts), so a
# single host serves every surface:
#   /                      public site
#   /dashboard             participant dashboard + checkout
#   /admin                 staff panel
#   /scanner               scanner PWA
#   /api/webhooks/razorpay Razorpay webhook target
#
# `http2 on;` requires nginx >= 1.25.1. Ubuntu's distro nginx (1.24) rejects
# it — install nginx from nginx.org mainline, or replace the directive with
# the legacy `listen 443 ssl http2;` form.


map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Default server: refuse anything that is not our host ------------------
# ssl_reject_handshake aborts the TLS handshake for unknown or missing SNI, so
# scanners hitting the bare origin IP never even see our certificate.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;

    ssl_reject_handshake on;

    server_name _;
    return 444;
}

# --- www -> apex ------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.${TARANG_DOMAIN};

    ssl_certificate     /etc/nginx/tls/origin.pem;
    ssl_certificate_key /etc/nginx/tls/origin.key;
    ssl_client_certificate /etc/nginx/tls/cloudflare-aop-ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 2;

    # 308 preserves the method and body, so a webhook accidentally pointed at
    # www still arrives as a POST rather than being downgraded to GET.
    return 308 https://${TARANG_DOMAIN}$request_uri;
}

# --- apex: the whole application -------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${TARANG_DOMAIN};

    ssl_certificate     /etc/nginx/tls/origin.pem;
    ssl_certificate_key /etc/nginx/tls/origin.key;
    ssl_client_certificate /etc/nginx/tls/cloudflare-aop-ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 2;

    include /etc/nginx/snippets/security-headers.conf;

    # Default cap for app routes; the webhook location raises its own.
    client_max_body_size 256k;

    # --- Provider webhooks -------------------------------------------------
    # Kept ahead of `location /` so it wins for /api/webhooks/*.
    # The handler rejects bodies over 1MB itself (route.ts) — this mirrors that
    # bound at the edge so oversized posts never reach Node. Timeouts are tight
    # because the handler durably inserts and returns 2xx, then works in after().
    location /api/webhooks/ {
        limit_except GET POST { deny all; }
        client_max_body_size 1m;

        proxy_pass http://next_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        # Supabase OAuth can emit large Set-Cookie response headers.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # --- Next.js static assets ---------------------------------------------
    location /_next/static/ {
        proxy_pass http://next_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # --- Everything else ---------------------------------------------------
    # proxy_buffering off keeps Next's streaming (RSC / Suspense) flowing.
    location / {
        proxy_pass http://next_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        # Supabase OAuth can emit large Set-Cookie response headers.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }
}
